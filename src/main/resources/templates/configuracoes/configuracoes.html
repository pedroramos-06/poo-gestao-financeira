<!DOCTYPE html>
<html lang="pt-BR" th:data-bs-theme="${usuario.tema.valor}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/styles.css}" rel="stylesheet">
    <style>
        body, body *,
        .form-control,
        .input-group-text {
            transition: background-color 0.3s ease-in,
            color 0.3s ease-in,
            border-color 0.3s ease-in;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<nav class="navbar navbar-expand px-5 bg-dark border-bottom" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/dashboard">WalletFlow</a>
        <ul class="navbar-nav align-items-center gap-4">
            <li class="nav-item">
                <a class="nav-link" href="/dashboard">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/metas">Metas</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/transacoes">Transações</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="/configuracoes">
                    <i class="bi bi-person-circle fs-5"></i>
                </a>
            </li>
        </ul>
    </div>
</nav>
<main class="container py-4">
    <div th:if="${sucesso != null or erro != null}"
         class="alert alert-dismissible fade show"
         th:classappend="${sucesso != null ? 'alert-success' : 'alert-danger'}"
         role="alert">
        <span th:text="${sucesso != null ? sucesso : erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Configurações da Conta</h2>
            <p class="text-muted mb-0">Gerencie as informações de sua conta e suas preferências</p>
        </div>

        <button onclick="history.back()" class="btn btn-outline-theme ms-auto">🠔 Voltar</button>
    </div>
    <div class="row g-3">
        <div class="col">
            <div class="card card-body h-100">
                <div class="d-flex justify-content-between mb-3">
                    <h4 class="card-title"><i class="bi bi-person me-2"></i>Usuário</h4>

                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-danger">Sair</button>
                    </form>
                </div>

                <p class="fw-semibold">Nome:
                    <span class="text-muted" th:text="${usuario.nome}"></span>
                </p>
                <p class="fw-semibold">Email:
                    <span class="text-muted" th:text="${usuario.email}"></span>
                </p>
                <p class="fw-semibold">Data de Criação:
                    <span class="text-muted" th:text="${#temporals.format(usuario.dataCriacao, 'dd/MM/yyyy HH:mm')}"></span>
                </p>

                <div class="d-flex gap-2 mt-auto">
                    <button class="w-100 btn btn-outline-primary">Mudar Nome</button>
                    <button class="w-100 btn btn-outline-danger">Excluir Dados</button>
                </div>
            </div>
        </div>

        <div class="col">
            <form class="card card-body" th:action="@{/configuracoes}" method="post" th:object="${configuracoes}">
                <input type="hidden" name="_method" value="put">
                <h4 class="card-title mb-3"><i class="bi bi-gear me-2"></i>Preferencias Gerais</h4>

                <label class="fw-semibold">Tema</label>
                <div class="d-flex gap-2 mb-3">
                    <input type="radio" class="btn-check" id="claro" autocomplete="off"
                           th:field="*{tema}" th:value="CLARO">
                    <label class="btn bg-body-tertiary w-100" for="claro">Claro</label>

                    <input type="radio" class="btn-check" id="escuro" autocomplete="off"
                           th:field="*{tema}" th:value="ESCURO">
                    <label class="btn bg-body-tertiary w-100" for="escuro">Escuro</label>
                </div>

                <label class="fw-semibold" for="metaPadrao">Meta Padrão</label>
                <div class="input-group mb-3">
                    <span class="input-group-text">R$</span>
                    <input class="form-control rounded-end" id="metaPadrao" type="number" step="0.01"
                           placeholder="Meta Padrão" oninput="this.classList.remove('is-invalid')"
                           th:field="*{metaPadrao}" th:classappend="${#fields.hasErrors('metaPadrao') ? 'is-invalid' : ''}">
                    <div class="invalid-feedback" th:errors="*{metaPadrao}"></div>
                </div>

                <button type="submit" class="btn btn-success mt-1">Salvar Configurações</button>
            </form>
        </div>

        <div class="col-12">
            <div class="card card-body">
                <h4 class="card-title"><i class="bi bi-trash3 me-2"></i>Lixeira</h4>
            </div>
        </div>
    </div>
</main>
<script>
    const temas = document.querySelectorAll("input[name='tema']");

    function aplicarTema(tema) {
        document.documentElement.setAttribute('data-bs-theme', tema);
    }

    temas.forEach(tema => {
        tema.addEventListener("change", function () {
            if (this.checked) aplicarTema(this.value === "CLARO" ? "light" : "dark");
        })
    });

    const temaJaMarcado = document.querySelector("input[name='tema']:checked");
    if (temaJaMarcado) {
        aplicarTema(temaJaMarcado.value === "CLARO" ? "light" : "dark");
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
