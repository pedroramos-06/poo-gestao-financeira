<!DOCTYPE html>
<html lang="pt-BR" th:data-bs-theme="${usuario.tema.valor}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|WalletFlow - ${categoria.id != null ? 'Editar Categoria' : 'Registrar Categoria'}|"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<nav class="navbar navbar-expand px-5 bg-dark border-bottom" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/dashboard">WalletFlow</a>
        <ul class="navbar-nav align-items-center gap-4">
            <li class="nav-item">
                <a class="nav-link" href="/dashboard">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="/categorias">Categorias</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/metas">Metas</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/transacoes">Transações</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/configuracoes">
                    <i class="bi bi-person-circle fs-5"></i>
                </a>
            </li>
        </ul>
    </div>
</nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1" th:text="${categoria.id} ? 'Editar Categoria' : 'Registrar Categoria'"></h2>
            <p class="text-muted mb-0"
               th:text="${categoria.id} ? 'Altere os campos que deseja mudar na Categoria'
               : 'Preencha os dados abaixo para registrar uma nova Categoria'"></p>
        </div>

        <a href="/categorias" class="btn btn-outline-theme ms-auto">🠔 Voltar para categorias</a>
    </div>

    <div class="card">
        <form class="card-body row g-4 p-4" th:action="@{/categorias}" method="post" th:object="${categoria}">
            <input th:if="${categoria.id}" type="hidden" name="_method" value="put"> <!-- Muda o method do form caso esteja editando uma transação -->
            <input type="hidden" th:field="*{id}">

            <h4>Dados da Categoria</h4>


            <div class="col-8">
                <label class="form-label" for="nome">Nome</label>
                <input class="form-control" id="nome" type="text" placeholder="Nome da categoria"
                       oninput="this.classList.remove('is-invalid')"
                       th:field="*{nome}" th:classappend="${#fields.hasErrors('nome') ? 'is-invalid' : ''}">
                <div class="invalid-feedback" th:errors="*{nome}"></div>
            </div>

            <div class="col-6">
                <label class="form-label">Tipo de transação</label>
                <div class="d-flex btn-group is-invalid" onclick="this.classList.remove('is-invalid')">
                    <input class="btn-check" id="entrada" type="radio" autocomplete="off"
                           th:field="*{tipo}" th:value="ENTRADA">
                    <label class="btn btn-outline-success w-100" for="entrada">Entrada</label>

                    <input class="btn-check" id="saida" type="radio" autocomplete="off"
                           th:field="*{tipo}" th:value="SAIDA">
                    <label class="btn btn-outline-danger w-100" for="saida">Saída</label>
                </div>
                <div class="invalid-feedback" th:errors="*{tipo}"></div>
            </div>

            <div class="col-4">
                <label class="form-label" for="cor">Cor</label>
                <input class="form-control form-control-color w-100" id="cor" type="color"
                       oninput="this.classList.remove('is-invalid')"
                       th:field="*{cor}" th:classappend="${#fields.hasErrors('cor') ? 'is-invalid' : ''}">
                <div class="invalid-feedback" th:errors="*{cor}"></div>
            </div>

            <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-success"
                        th:text="${categoria.id} ? 'Editar Categoria' : 'Salvar Categoria'"></button>
            </div>
        </form>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
