<!DOCTYPE html>
<html lang="pt-BR" th:data-bs-theme="${usuario.tema.valor}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalletFlow - Listar Categorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<nav class="navbar navbar-expand px-5 bg-dark border-bottom" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/dashboard">WalletFlow</a>
        <ul class="navbar-nav align-items-center gap-4">
            <li class="nav-item">
                <a class="nav-link" href="/dashboard">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="/categorias">Categorias</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/metas">Metas</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/transacoes">Transações</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/configuracoes">
                    <i class="bi bi-person-circle fs-5"></i>
                </a>
            </li>
        </ul>
    </div>
</nav>
<main class="container py-4 d-flex flex-column gap-4">
    <div th:if="${sucesso != null or erro != null}"
         class="alert alert-dismissible fade show"
         th:classappend="${sucesso != null ? 'alert-success' : 'alert-danger'}"
         role="alert">
        <span th:text="${sucesso != null ? sucesso : erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h2 class="mb-1">Categorias</h2>
            <p class="text-muted mb-0">Liste, edite ou exclua suas categorias</p>
        </div>

        <a href="/categorias/criar" class="btn btn-success">+ Nova Categoria</a>
    </div>

    <!-- Categorias de Entrada -->
    <div>
        <h5 class="mb-2">Entrada</h5>
        <div class="card overflow-hidden">
            <table class="table table-hover mb-0 text-center align-middle">
                <thead class="table-dark">
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Tipo</th>
                    <th scope="col">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${categorias}" th:if="${c.tipo.name() == 'ENTRADA'}">
                    <td>
                        <span class="badge badge-categoria"
                              th:style="|--cor-categoria: ${c.cor}|"
                              th:text="${c.nome}">
                        </span>
                    </td>
                    <td>
                        <span class="badge text-bg-success" th:text="${c.tipo.descricao}"></span>
                    </td>
                    <td>
                        <div class="btn-group" th:if="${!c.padrao}">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/categorias/{id}/editar(id=${c.id})}">Editar</a>
                            <a class="btn btn-sm btn-outline-danger" th:href="@{/categorias/{id}/excluir(id=${c.id})}">Excluir</a>
                        </div>
                        <span class="badge text-bg-secondary" th:if="${c.padrao}" title="Categoria padrão do sistema, não pode ser editada ou excluída">
                            Padrão
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Categorias de Saída -->
    <div>
        <h5 class="mb-2">Saída</h5>
        <div class="card overflow-hidden">
            <table class="table table-hover mb-0 text-center align-middle">
                <thead class="table-dark">
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Tipo</th>
                    <th scope="col">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${categorias}" th:if="${c.tipo.name() == 'SAIDA'}">
                    <td>
                        <span class="badge badge-categoria"
                              th:style="|--cor-categoria: ${c.cor}|"
                              th:text="${c.nome}">
                        </span>
                    </td>
                    <td>
                        <span class="badge text-bg-danger" th:text="${c.tipo.descricao}"></span>
                    </td>
                    <td>
                        <div class="btn-group" th:if="${!c.padrao}">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/categorias/{id}/editar(id=${c.id})}">Editar</a>
                            <a class="btn btn-sm btn-outline-danger" th:href="@{/categorias/{id}/excluir(id=${c.id})}">Excluir</a>
                        </div>
                        <span class="badge text-bg-secondary" th:if="${c.padrao}" title="Categoria padrão do sistema, não pode ser editada ou excluída">
                            Padrão
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
