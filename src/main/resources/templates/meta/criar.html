<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|WalletFlow - ${meta.id != null ? 'Editar Meta' : 'Registrar Meta'}|"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<nav class="navbar navbar-expand px-5 bg-dark" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/dashboard">WalletFlow</a>
        <ul class="navbar-nav gap-4">
            <li class="nav-item">
                <a class="nav-link" href="/dashboard">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/categorias">Categorias</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="/metas">Metas</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/transacoes">Transações</a>
            </li>
            <li class="nav-item">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-danger">Sair</button>
                </form>
            </li>
        </ul>
    </div>
</nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1" th:text="${meta.id} ? 'Editar Meta' : 'Registrar Meta'"></h2>
            <p class="text-muted mb-0"
               th:text="${meta.id} ? 'Altere os campos que deseja mudar na Meta'
               : 'Preencha os dados abaixo para registrar uma nova Meta'"></p>
        </div>

        <a href="/metas" class="btn btn-outline-dark ms-auto">🠔 Voltar para metas</a>
    </div>

    <div class="card">
        <form class="card-body row g-4 p-4" th:action="@{/metas}" method="post" th:object="${meta}">
            <input th:if="${meta.id}" type="hidden" name="_method" value="put"> <!-- Muda o method do form caso esteja editando uma transação -->
            <input type="hidden" th:field="*{id}">

            <h4>Dados da Meta</h4>

            <div class="col-6">
                <label class="form-label" for="data">Data</label>
                <input class="form-control" id="data" type="month" oninput="this.classList.remove('is-invalid')"
                       th:field="*{data}" th:classappend="${#fields.hasErrors('data') ? 'is-invalid' : ''}">
                <div class="invalid-feedback" th:errors="*{data}"></div>
            </div>

            <div class="col-6">
                <label class="form-label" for="valor">Valor</label>
                <div class="input-group">
                    <span class="input-group-text">R$</span>
                    <input class="form-control rounded-end" id="valor" type="number" step="0.01"
                           placeholder="Limite desejado" oninput="this.classList.remove('is-invalid')"
                           th:field="*{valor}" th:classappend="${#fields.hasErrors('valor') ? 'is-invalid' : ''}">
                    <div class="invalid-feedback" th:errors="*{valor}"></div>
                </div>
            </div>
            <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-success"
                        th:text="${meta.id} ? 'Editar Meta' : 'Salvar Meta'"></button>
            </div>
        </form>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
